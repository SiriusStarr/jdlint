[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[[system.children]]
name = "A"
format = "/#A/"
id = "/=A/"

[[system.children.children]]
name = "B"
format = "/=A//#ID//*Name/"
id = "/=A/./=ID/"
allow_arbitrary_contents = true

[[system.children]]
name = "C"
format = "B/#B/"
id = "/=B/"

[[system.children.children]]
name = "D"
format = "/=B//#ID//*Name/"
id = "/=B/./=ID/"
allow_arbitrary_contents = true
