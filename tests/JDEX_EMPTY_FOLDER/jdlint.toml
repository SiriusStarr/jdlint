[linter]
json_output = true
ignore = [".placeholder"]

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.children]]
name = "B"
format = "/=A//*Name/"
allow_arbitrary_contents = true

[[system.jdex.children.children.notes]]
name = "C1"
format = "X.md"

[[system.jdex.children.children.notes.ids]]
id = "/=A/"
entry = "/=A/"

[[system.default.children]]
name = "Area"
format = "/#A/"
id = "/=A/"
allow_arbitrary_contents = true
