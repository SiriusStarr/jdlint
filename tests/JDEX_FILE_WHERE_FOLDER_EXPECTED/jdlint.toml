[linter]
json_output = true

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.children]]
name = "B"
format = "/=A//*Name/"

[[system.jdex.children.children.notes]]
name = "C"
format = "/=A/.md"

[[system.jdex.children.children.notes.ids]]
id = "/=A/"
entry = "/=A/"

[[system.jdex.children.children.notes]]
name = "C"
format = "/=A//=Name/.md"

[[system.jdex.children.children.notes.ids]]
id = "/=A/./=Name/"
entry = "/=A/./=Name/"

[[system.default.children]]
name = "Area"
format = "/#A/"
id = "/=A/"
allow_arbitrary_contents = true
