[linter]
json_output = true
ignore = [".placeholder"]

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex.txt"
entry = "/=id/ /=title/"

[[system.default.children]]
name = "Area"
format = "/#A/0-/=A/9 /*Area/"
id = "/=A/0-/=A/9"

[[system.default.children.children]]
name = "10 Category"
format = "10 /*Category/"
id = "10"
no_jdex_entry = true

[[system.default.children.children]]
name = "Category"
format = "/=A//#C/ /*Category/"
id = "/=A//=C/"

[[system.default.children.children.children]]
name = "ID"
format = "/=A//=C/.12 Myslef"
id = "/=A//=C/.12"
jdex_entry = "/=A//=C/.12 Myself"
can_be_file = true
allow_arbitrary_contents = true

[[system.default.children.children.children]]
name = "ID"
format = "/=A//=C/./##ID/ /*IDName/"
id = "/=A//=C/./=ID/"
can_be_file = true
allow_arbitrary_contents = true
