[linter]
json_output = true
ignore = [".placeholder"]

[[system.roots]]
name = "Files"
path = "files"

## ###########################################################
# Standard
## ###########################################################
[[system.default.children]]
name = "Area"
format = "/#A/0-/=A/9 /*Area/"
jdex_note = "/=A/0.00 /=Area/.md"
id = "/=A/0-/=A/9"

[[system.default.children.children]]
name = "Category"
format = "/=A//#C/ /*Category/"
jdex_note = "/=A//=C/.00 /=Category/.md"
id = "/=A//=C/"

[[system.default.children.children.children]]
name = "Header"
format = "/=A//=C/./#I/0 ■ /*Header/"
jdex_note = "/=A//=C/./=I/0 ■ /=Header/.md"
id = "/=A//=C/./=I/0"

[[system.default.children.children.children]]
name = "Inbox"
format = "/=A//=C/.01 /*Inbox/"
jdex_note = "/=A//=C/.01 /=Inbox/.md"
id = "/=A//=C/.01"

[[system.default.children.children.children]]
name = "ID"
format = "/=A//=C/./##ID/ /*IDName/"
jdex_note = "/=A//=C/./=ID/ /=IDName/.md"
id = "/=A//=C/./=ID/"
can_be_file = true
allow_arbitrary_contents = true
