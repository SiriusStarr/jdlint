[standard_jdex]
[[standard_jdex.children]]
template = "area_folder"

[[standard_jdex.children.children]]
template = "category_folder"

[[standard_jdex.children]]
template = "work_package_area_folder"

[standard_system]
[[standard_system.children]]
template = "area_folder"

[[standard_system.children.children]]
template = "category_folder"
children = [{ template = "header_folder" }, { template = "inbox_folder" }, { template = "id_folder" }]

[[standard_system.children]]
template = "work_package_area_folder"
children = [{ template = "work_package_folder" }]

[standard_system_with_sys_folder]
name = "System"
format = "/*SYS/ /*System/"
id = "/=SYS/"

[[standard_system_with_sys_folder.children]]
template = "area_folder"

[[standard_system_with_sys_folder.children.children]]
template = "category_folder"
children = [{ template = "header_folder" }, { template = "inbox_folder" }, { template = "id_folder" }]

[[standard_system_with_sys_folder.children]]
template = "work_package_area_folder"
children = [{ template = "work_package_folder" }]

[system_folder]
name = "System"
format = "/*SYS/ /*System/"
id = "/=SYS/"

[area_folder]
name = "Area"
format = "/#A/0-/=A/9 /*Area/"
id = "/=A/0-/=A/9"

[category_folder]
name = "Category"
format = "/=A//#C/ /*Category/"
id = "/=A//=C/"
notes = [{ template = "area_note" }, { template = "category_note" }, { template = "inbox_note" }, { template = "bad_inbox_note" }, { template = "id_note" }]

[header_folder]
name = "Header"
format = "/=A//=C/./#I/0 ■ /*Header/"
id = "/=A//=C/./=I/0"

[inbox_folder]
name = "Inbox"
format = "/=A//=C/.01 Inbox"
id = "/=A//=C/.01"

[id_folder]
name = "ID"
format = "/=A//=C/./##ID/ /*IDName/"
id = "/=A//=C/./=ID/"
can_be_file = true
allow_arbitrary_contents = true

[work_package_area_folder]
name = "Work Packages Area"
format = "W0000-W9999 /*Area/"
id = "W0000-W9999"
no_jdex_entry = true
notes = [{ template = "work_package_note" }]

[work_package_folder]
name = "Work Package"
format = "W/####WPID/~/##AC/./##ID/ /*WPName/"
id = "W/=WPID/"
allow_arbitrary_contents = true

[area_note]
name = "JDex Area Note"
format = "/=A/0.00 /*Name/.md"

[[area_note.ids]]
id = "/=A/0-/=A/9"
entry = "/=A/0-/=A/9 /=Name/"

[[area_note.ids]]
id = "/=A/0"
parent = "/=A/0-/=A/9"
entry = "/=A/0 /=Name/"

[[area_note.ids]]
id = "/=A/0.00"
parent = "/=A/0"
entry = "/=A/0.00 /=Name/"

[category_note]
name = "JDex Category Note"
format = "/=A//=C/.00 /*Name/.md"

[[category_note.ids]]
id = "/=A//=C/"
parent = "/=A/0-/=A/9"
entry = "/=A//=C/ /=Name/"

[[category_note.ids]]
id = "/=A//=C/.00"
parent = "/=A//=C/"
entry = "/=A//=C/.00 /=Name/"

[inbox_note]
name = "JDex Inbox"
format = "/=A//=C/.01 Inbox.md"

[[inbox_note.ids]]
id = "/=A//=C/.01"
parent = "/=A//=C/"
entry = "/=A//=C/.01 Inbox"

[bad_inbox_note]
name = "JDex Bad Inbox"
format = "/=A//=C/.01 /*Name/"
forbidden = true

[id_note]
name = "JDex Id Note"
format = "/=A//=C/./##ID/ /*Name/.md"

[[id_note.ids]]
id = "/=A//=C/./=ID/"
parent = "/=A//=C/"
entry = "/=A//=C/./=ID/ /=Name/"

[work_package_note]
name = "Work Package"
format = "W/####WPID/~/##AC/./##ID/ /*WPName/.md"

[[work_package_note.ids]]
id = "W/=WPID/"
parent = "/=AC/./=ID/"
entry = "W/=WPID/~/=AC/./=ID/ /=WPName/"
