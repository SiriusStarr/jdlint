[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.notes]]
name = "C"
format = "/=A/.md"

[[system.jdex.children.notes.ids]]
id = "/=A/"
entry = "/=A/"

[[system.jdex.children.notes]]
name = "B"
format = "/=A//#ID/ /*Name/.md"

[[system.jdex.children.notes.ids]]
id = "/=A/./=ID/"
entry = "/=A/./=ID/ /=Name/"

[[system.default.children]]
name = "Area"
format = "/#A/"
id = "/=A/"
allow_arbitrary_contents = true
