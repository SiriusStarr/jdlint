[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.notes]]
name = "B"
format = "/=A//#ID//*Name/.md"
id = "/=A/./=ID/"

[[system.children]]
name = "Area"
format = "/#A/"
jdex_note = "/=A/.md"
id = "/=A/"
allow_arbitrary_contents = true
