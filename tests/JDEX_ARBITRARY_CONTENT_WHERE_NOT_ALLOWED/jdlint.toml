[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.children]]
name = "B1"
format = "/*Name//=A/"
allow_arbitrary_contents = true

[[system.jdex.children.children.notes]]
name = "C1"
format = "X.md"

[[system.jdex.children.children.notes.ids]]
id = "/=A/./=Name/"
entry = "/=A/./=Name/"

[[system.jdex.children.children]]
name = "B2"
format = "/=A//*Name/"

[[system.jdex.children.children.notes]]
name = "C3"
format = "/=A/.md"

[[system.jdex.children.children.notes.ids]]
id = "/=A/"
entry = "/=A/"

[[system.jdex.children.children.notes]]
name = "C2"
format = "/=A//=Name/.md"

[[system.jdex.children.children.notes.ids]]
id = "/=A/./=Name/"
entry = "/=A/./=Name/"

[[system.default.children]]
name = "Area"
format = "/#A/"
id = "/=A/"
allow_arbitrary_contents = true
