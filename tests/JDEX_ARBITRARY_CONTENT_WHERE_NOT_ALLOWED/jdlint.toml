[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.children]]
name = "B1"
format = "/*Name//=A/"
allow_arbitrary_contents = true

[[system.jdex.children.children.notes]]
name = "C1"
format = "X.md"

[[system.jdex.children.children]]
name = "B2"
format = "/=A//*Name/"

[[system.jdex.children.children.notes]]
name = "C2"
format = "/=A//=Name/.md"

## ###########################################################
# Standard
## ###########################################################
[[system.children]]
name = "Area"
format = "/#A/0-/=A/9 /*Area/"
jdex_note = "/=A/0.00 /=Area/.md"
allow_arbitrary_contents = true
