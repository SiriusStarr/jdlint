[linter]
json_output = true
ignore = [".placeholder"]

[[system]]
id = "S1"
name = "First System"

[[system.roots]]
name = "Files"
path = "sys1/files"

[system.jdex]
path = "sys1/jdex"
template = "standard_jdex"

[system.default]
template = "standard_system"

[[system]]
id = "S2"
name = "Second System"

[[system.roots]]
name = "Files"
path = "sys2/files"

[system.jdex]
path = "sys2/jdex"
template = "standard_jdex"

[system.default]
template = "standard_system"

[template]
imports = ["../../configs/standard_templates.toml"]
