[linter]
json_output = true
ignore = [".placeholder"]

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex"
template = "standard_jdex"

[system.default]
template = "standard_system"

[template]
imports = ["../../configs/standard_templates.toml"]

[template.standard_jdex]
note_extension = ".md"

[[template.standard_jdex.children]]
template = "area_folder"
children = [{ name = "Bad", format = "Bad", forbidden = true }, { template = "area_category_folder", children = [] }, { template = "category_folder", children = [] }]
