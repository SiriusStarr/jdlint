[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[system.jdex]
path = "files"

[[system.jdex.children]]
name = "A"
format = "/#A/"

[[system.jdex.children.children]]
name = "B"
format = "/=A//*Name/"

[[system.jdex.children.children.notes]]
name = "JDex Note"
format = "/=A//=Name/.md"
id = "/=A/./=Name/"

## ###########################################################
# Standard
## ###########################################################
[[system.children]]
name = "Area"
format = "/#A/0-/=A/9 /*Area/"
jdex_note = "/=A/0.00 /=Area/.md"
id = "/=A/./=Area/"
allow_arbitrary_contents = true
