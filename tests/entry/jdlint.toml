[linter]
json_output = true
ignore = [".placeholder"]

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex"
template = "standard_jdex"

[system.default]
[[system.default.children]]
template = "area_folder"

[[system.default.children.children]]
name = "10 Category"
format = "10 /*Category/"
id = "10"
no_jdex_entry = true

[[system.default.children.children]]
template = "category_folder"

[[system.default.children.children.children]]
name = "ID"
format = "/=A//=C/.12 Myslef"
id = "/=A//=C/.12"
entry = "/=A//=C/.12 Myself"
can_be_file = true
allow_arbitrary_contents = true

[[system.default.children.children.children]]
template = "id_folder"

[template]
imports = ["../standard_templates.toml"]
