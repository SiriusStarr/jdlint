[linter]
json_output = true
ignore = [".placeholder"]
disable_rules = ["EMPTY_FOLDER"]

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex.jd.json"
entry = "/=id/ /=title/"

[[system.default.children]]
template = "system_folder"

[template]
imports = ["../../configs/standard_templates.toml"]
