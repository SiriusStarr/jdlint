[linter]
json_output = true
ignore = [".placeholder"]
disable_rules = ["JDEX_DUPLICATE_ID"]

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex"
template = "standard_jdex"

[system.default]
template = "standard_system"

[template]
imports = ["../../configs/standard_templates.toml"]
