[linter]
json_output = true
ignore = [".placeholder"]
disable_rules = []

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex"
template = "standard_jdex"

[system.default]
template = "standard_system"

[template]
imports = ["../../configs/standard_templates.toml"]

# Override work packages to inherit from other ones
[template.work_package]
name = "Work Package"
format = "W/####WPID/~W/####ID/ /*WPName/"
id = "W/=WPID/"
parent = "W/=ID/"
allow_arbitrary_contents = true
