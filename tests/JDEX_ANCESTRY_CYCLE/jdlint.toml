[linter]
json_output = true
ignore = [".placeholder"]
disable_rules = []

[[system.roots]]
name = "Files"
path = "files"

[system.jdex]
path = "jdex"
template = "standard_jdex"

[system.default]
template = "standard_system"

[template]
imports = ["../standard_templates.toml"]

# Override work packages to inherit from other ones
[template.work_package_folder]
name = "Work Package"
format = "W/####WPID/~W/####ID/ /*WPName/"
id = "W/=WPID/"
allow_arbitrary_contents = true

[template.work_package_note]
name = "Work Package"
format = "W/####WPID/~W/####ID/ /*WPName/.md"

[[template.work_package_note.ids]]
id = "W/=WPID/"
parent = "W/=ID/"
entry = "W/=WPID/~W/=ID/ /=WPName/"
