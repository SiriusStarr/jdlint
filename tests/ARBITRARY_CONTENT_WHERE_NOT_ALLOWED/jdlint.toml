[linter]
json_output = true

[[system.roots]]
name = "JDex"
path = "files"

[[system.default.children]]
name = "A"
format = "/#A/"
id = "/=A/"

[[system.default.children.children]]
name = "B1"
format = "/*Name//=A/"
id = "/=A/./=Name/"
allow_arbitrary_contents = true

[[system.default.children.children]]
name = "B2"
id = "/=A/./=Name/"
format = "/=A//*Name/"

[[system.default.children.children.children]]
name = "C2"
format = "/=A//=Name/"
id = "/=A/./=Name/ Child"
allow_arbitrary_contents = true
